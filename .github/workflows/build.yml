# pek-builder: builds the PRIVATE app repo on free public-repo runners.
#
# Put this file in the PUBLIC builder repo at:  .github/workflows/build.yml
# The builder repo should contain nothing else except a README.
#
# Secrets (builder repo -> Settings -> Secrets and variables -> Actions):
#   PRIVATE_REPO         the private repo as  owner/name   (e.g. R3CT01/pek-tv)
#   PRIVATE_REPO_TOKEN   fine-grained token, ONLY that repo, Contents: Read and write
#
# Privacy design:
#   - Manual trigger only (nobody else can start it).
#   - Build output goes to log files, never to the public log, because compile
#     errors print lines of your source code.
#   - Nothing is uploaded as a public artifact. The APK and the logs are attached
#     to a Release in the PRIVATE repo instead.

name: Build Android APK (private source)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of the private repo to build'
        default: 'android'
        required: true

permissions:
  contents: read

concurrency:
  group: pek-build
  cancel-in-progress: false

jobs:
  build:
    # Only runs in your own account; forks do nothing.
    if: github.repository_owner == 'R3CT01'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Get the private code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false   # the token is not left on disk during the build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy compiles the app's Python with a build Python matching the app's (3.11).
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Cache OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: android/openssl
          key: openssl-${{ hashFiles('android/scripts/build-openssl.sh') }}

      - name: Build OpenSSL for Android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: bash android/scripts/build-openssl.sh > "$RUNNER_TEMP/openssl.log" 2>&1

      # SMB support. If this fails the app still builds without it.
      - name: Get libsmb2
        continue-on-error: true
        run: git clone --depth 1 https://github.com/sahlberg/libsmb2.git android/libsmb2

      - name: Get libnfs
        continue-on-error: true
        run: git clone --depth 1 https://github.com/sahlberg/libnfs.git android/libnfs

      # Torrent streaming inputs (libtorrent + Boost headers).
      - name: Get libtorrent and Boost headers
        continue-on-error: true
        run: |
          git clone --depth 1 --branch RC_2_0 --recurse-submodules https://github.com/arvidn/libtorrent.git android/libtorrent
          curl -fsSL https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz -o /tmp/boost.tgz
          mkdir -p android/boost
          tar -xzf /tmp/boost.tgz -C android/boost --strip-components=1 boost_1_86_0/boost

      - name: Copy the web frontend into the app
        run: |
          mkdir -p android/app/src/main/assets/hesper
          cp -r www skins plugins android/app/src/main/assets/hesper/
          find android/app/src/main/assets -name __pycache__ -type d -exec rm -rf {} +
          curl -fsSL https://curl.se/ca/cacert.pem -o android/app/src/main/assets/hesper/cacert.pem

      # Output is redirected to a file so no source lines reach the public log.
      - name: Build debug APK (with torrent streaming)
        id: with_torrent
        continue-on-error: true
        working-directory: android
        run: |
          gradle assembleDebug -PhesperTorrent=true --no-daemon --stacktrace --console=plain \
            > "$GITHUB_WORKSPACE/build-torrent.log" 2>&1
          code=$?
          grep -E '^BUILD (SUCCESSFUL|FAILED)' "$GITHUB_WORKSPACE/build-torrent.log" || true
          exit $code

      - name: Build debug APK (without torrent streaming, fallback)
        id: fallback
        if: steps.with_torrent.outcome != 'success'
        continue-on-error: true
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace --console=plain \
            > "$GITHUB_WORKSPACE/build-fallback.log" 2>&1
          code=$?
          grep -E '^BUILD (SUCCESSFUL|FAILED)' "$GITHUB_WORKSPACE/build-fallback.log" || true
          exit $code

      # APK and logs go to a Release in the PRIVATE repo only.
      - name: Upload results to the private repo's Releases
        if: always()
        env:
          TORRENT_OUTCOME: ${{ steps.with_torrent.outcome }}
          FALLBACK_OUTCOME: ${{ steps.fallback.outcome }}
        run: |
          set -u
          TAG="build-${{ github.run_number }}-$(date -u +%Y%m%d-%H%M)"
          SHA="$(git rev-parse HEAD)"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          FILES=()

          if [ "$TORRENT_OUTCOME" = "success" ] && [ -f "$APK" ]; then
            cp "$APK" pek-debug-torrent.apk;   FILES+=(pek-debug-torrent.apk)
            NOTE="Debug APK with torrent streaming."
          elif [ "$FALLBACK_OUTCOME" = "success" ] && [ -f "$APK" ]; then
            cp "$APK" pek-debug-notorrent.apk; FILES+=(pek-debug-notorrent.apk)
            NOTE="Debug APK WITHOUT torrent streaming (the torrent build failed; see build-torrent.log)."
          else
            NOTE="Build failed. See the attached logs."
          fi

          for f in build-torrent.log build-fallback.log; do
            [ -f "$f" ] && FILES+=("$f")
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nothing to upload."
            exit 0
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --repo "$PRIVATE_REPO" \
            --target "$SHA" \
            --title "Build $TAG" \
            --notes "$NOTE" \
            --prerelease
          echo "Uploaded to the private repo's Releases as $TAG."

      - name: Mark the run failed if no APK was built
        if: steps.with_torrent.outcome != 'success' && steps.fallback.outcome != 'success'
        run: |
          echo "Build failed. The log is attached to the latest Release in the private repo."
          exit 1
